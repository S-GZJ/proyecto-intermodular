<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ISIMatch</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- estilos propios de la pagina -->
    <style>
      .caja-login {
        border: 1px solid #ccc;
        padding: 30px;
        border-radius: 10px;
        background-color: white;
      }
      .mi-boton {
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 5px;
      }
    </style>
  </head>

  <body class="d-flex align-items-center min-vh-100 py-5">
    <a
      href="index.html"
      class="position-absolute top-0 start-0 m-4 text-decoration-none text-muted"
    >
      <i class="bi bi-arrow-left"></i> Volver al inicio
    </a>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          <div class="caja-login shadow-sm">
            <div class="text-center mb-4">
              <h2 style="font-weight: bold">¡Hola de nuevo!</h2>
              <p>Ingresa a tu cuenta para continuar aprendiendo</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label"><b>CORREO ELECTRÓNICO</b></label>
                <div class="input-group">
                  <span class="input-group-text bg-white">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="nombre@ejemplo.com"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label"><b>CONTRASEÑA</b></label>
                <div class="input-group">
                  <span class="input-group-text bg-white">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="********"
                    required
                  />
                </div>
              </div>

              <div class="text-end mb-4">
                <a href="#" class="small text-decoration-none"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>

              <button
                type="submit"
                class="mi-boton w-100 py-3 text-uppercase fw-bold"
              >
                Entrar
              </button>
            </form>

            <hr class="my-4" />

            <p class="text-center small mb-0">
              ¿Aún no tienes cuenta? <br />
              <a href="registro.html" class="fw-bold text-decoration-none"
                >Regístrate gratis</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      //script para controlar el formulario
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // Esto es para que no se recargue la pagina sola

          //cojo los valores de los inputs
          const email = document.getElementById("email").value.toLowerCase();
          const password = document.getElementById("password").value;
          const boton = this.querySelector("button");

          //validacion sencilla de que no esten vacios
          if (email == "" || password == "") {
            alert("Por favor, rellena todos los campos.");
            return;
          }

          //cambio el texto del boton mientras carga
          boton.innerText = "VERIFICANDO...";
          boton.disabled = true;

          //un temporizador para simular que el servidor responde
          setTimeout(() => {
            //comprobar si es profe o alumno segun el correo
            if (email.includes("profe") || email.includes("admin")) {
              window.location.href = "dashboard-profesor.html";
            } else {
              window.location.href = "dashboard-alumno.html";
            }
          }, 1500);
        });
    </script>
  </body>
</html>
