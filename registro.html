<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Crea tu cuenta - ISIMatch</title>
    <!-- Importar boostrap para el diseño responsive y componentes visuales, también librería de iconos -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="d-flex align-items-center min-vh-100 py-5">
    <!--contenedor principal de toda la zona de registro-->
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <!--este div contiene todo el formulario-->
          <div class="card card-custom p-5">
            <!--titulo y subtitulo del formulario-->
            <div class="text-center mb-4">
              <h2 class="fw-bold">Únete a ISIMatch</h2>
              <p class="text-muted">Selecciona tu perfil para empezar</p>
            </div>

            <!--apartado para seleccionar si eres profesor o alumno-->
            <div class="row g-3 mb-4">
              <!--parte de alumno-->
              <div class="col-6">
                <div
                  class="card role-card h-100 p-3 text-center"
                  id="card-alumno"
                  onclick="selectRole('alumno')"
                >
                  <i class="bi bi-emoji-smile role-icon mb-2"></i>
                  <h6 class="fw-bold">Soy Alumno</h6>
                  <small class="text-muted">Quiero aprender</small>
                </div>
              </div>

              <!--parte de profesor-->
              <div class="col-6">
                <div
                  class="card role-card h-100 p-3 text-center"
                  id="card-profesor"
                  onclick="selectRole('profesor')"
                >
                  <i class="bi bi-person-workspace role-icon mb-2"></i>
                  <h6 class="fw-bold">Soy Profesor</h6>
                  <small class="text-muted">Quiero enseñar</small>
                </div>
              </div>
            </div>

            <form id="registroForm">
              <!--campo del nombre-->
              <div class="mb-3">
                <label class="form-label small fw-bold text-muted"
                  >NOMBRE COMPLETO</label
                >
                <input
                  type="text"
                  class="form-control"
                  placeholder="Ej. Juan Pérez"
                  required
                />
              </div>

              <!--campo del corro-->
              <div class="mb-3">
                <label class="form-label small fw-bold text-muted"
                  >CORREO ELECTRÓNICO</label
                >
                <input
                  type="email"
                  class="form-control"
                  placeholder="juan@ejemplo.com"
                  required
                />
              </div>

              <div class="row mb-3">
                <!--campo de tu fecha de nacimiento-->
                <div class="col-6">
                  <label class="form-label small fw-bold text-muted"
                    >AÑO NACIMIENTO</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    placeholder="2000"
                    required
                  />
                </div>

                <!--campo de la contraseña-->
                <div class="col-6">
                  <label class="form-label small fw-bold text-muted"
                    >CONTRASEÑA</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    placeholder="********"
                    required
                  />
                </div>
              </div>

              <!--interes principal, en cuanto a Materia-->
              <div class="mb-4">
                <label class="form-label small fw-bold text-muted"
                  >INTERÉS PRINCIPAL</label
                >
                <select class="form-select">
                  <option selected>Selecciona una materia...</option>
                  <option value="matematicas">Matemáticas</option>
                  <option value="idiomas">Idiomas</option>
                  <option value="programacion">Programación</option>
                </select>
              </div>

              <!--un campo checkbox para aceptar términos y servicios-->
              <div class="mb-4 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="teminos"
                  required
                />
                <label class="form-check-label small text-muted" for="terminos">
                  Acepto los
                  <a href="#" class="text-primary-custom"
                    >términos y condiciones</a
                  >
                </label>
              </div>

              <!--campo para guardar el rol que selecciones-->
              <input type="hidden" id="rol" value="" />

              <!--botón de envio del formulario-->
              <button
                type="submit"
                class="btn btn-primary-custom w-100 py-3 shadow-sm"
              >
                CREAR CUENTA GRATIS
              </button>
            </form>

            <!--un enlace por si ya tienes una cuenta creada-->
            <p class="text-center mt-4 small text-muted">
              ¿Ya tienes cuenta?
              <a href="login.html" class="text-primary-custom fw-bold"
                >Inicia sesión</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      /**Esta función es para el rol seleccionado
       * La función principal es marcar cual has elegido y guardar el seleccionado*/
      function selectRole(role) {
        document
          .querySelectorAll(".role-card")
          .forEach((el) => el.classList.remove("selected"));
        document.getElementById("card-" + role).classList.add("selected");
        document.getElementById("rol").value = role;
      }

      /** Al cargar la página, comprueba si hay un rol preseleccionado en la URL*/
      window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const rolPreseleccionado = urlParams.get("rol");
        if (rolPreseleccionado === "profesor") selectRole("profesor");
        else if (rolPreseleccionado === "alumno") selectRole("alumno");
      };

      /** Evita que la página se recargue automáticamente,
       * valida que se haya seleccioando un rol y
       * simula un tiempo de espera
       */
      document
        .getElementById("registroForm")
        .addEventListener("submit", function (evento) {
          evento.preventDefault();

          const rol = document.getElementById("rol").value;
          if (!rol) {
            alert("Por favor, selecciona si eres Alumno o Profesor.");
            return;
          }

          //Cambia el botón para dar feedback al usuario
          const boton = this.querySelector('button[type="submit"]');
          boton.innerText = "CREANDO CUENTA...";
          boton.disabled = true;

          setTimeout(() => {
            // REDIRECCIÓN
            if (rol === "profesor") {
              window.location.href = "dashboard-profesor.html";
            } else {
              window.location.href = "dashboard-alumno.html";
            }
          }, 1500);
        });
    </script>
  </body>
</html>
